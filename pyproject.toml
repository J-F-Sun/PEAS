[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "peas-point-to-sphere"
version = "0.1.0"
description = "PEAS point-to-sphere paper reproduction and inference"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==2.5.4", "scipy==1.18.1", "torch==2.14.1", "matplotlib==3.11.2", "PyYAML==6.0.3"]

[project.optional-dependencies]
fem = ["gmsh==4.15.2"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["peas*"]

[tool.uv]
required-version = ">=0.11"
constraint-dependencies = [
  "kiwisolver==1.5.1",
  "torch==2.14.1",
  "fonttools==4.66.1",
  "packaging==26.3",
  "networkx==3.7",
  "numpy==2.5.4",
  "contourpy==1.4.0",
  "sympy==1.14.0",
  "setuptools==84.0.0",
  "python-dateutil==2.9.0.post0",
  "mpmath==1.3.0",
  "PyYAML==6.0.3",
  "fsspec==2026.9.0",
  "filelock==4.1.1",
  "matplotlib==3.11.2",
  "cycler==0.12.1",
  "Jinja2==3.1.6",
  "typing_extensions==4.16.0",
  "MarkupSafe==3.0.4",
  "pillow==12.3.0",
  "pyparsing==3.3.3",
  "six==1.17.0",
  "scipy==1.18.1",
]
