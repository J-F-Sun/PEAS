[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "frozen-pinn-molecular-diffusion"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["numpy==1.26.4", "scipy==1.12.0", "scikit-learn==1.4.2", "swimnetworks==0.0.2", "matplotlib==3.9.4", "cloudpickle==3.1.2", "threadpoolctl==3.8.0"]

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = ["pytest==9.2.0"]
